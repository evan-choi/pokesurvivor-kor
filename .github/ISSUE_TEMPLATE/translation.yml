name: 번역 제안
description: 어색한 번역, 잘못된 이름, 원문이 섞인 문구를 알려주세요.
title: "[번역] "
body:
  - type: input
    id: screen
    attributes:
      label: 문제가 보이는 화면
      placeholder: "예: 포켓몬 도감 → 파트너 선택 버튼"
    validations:
      required: true
  - type: textarea
    id: current
    attributes:
      label: 현재 표시되는 문구
      description: 한국어와 원문이 섞여 있다면 보이는 그대로 적어주세요.
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: 제안하는 한국어
      description: 적절한 번역을 모르겠다면 비워두셔도 됩니다. 이름을 바꾸는 제안은 근거 링크가 도움이 됩니다.
  - type: textarea
    id: original
    attributes:
      label: 원문 또는 스크린샷
      description: 확인할 수 있다면 영어·스페인어 원문을 적어주세요. 스크린샷에서는 개인 정보를 가려주세요.
