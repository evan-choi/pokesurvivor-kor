<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PokéSurvivor 한국어 모드</title>
    <link rel="stylesheet" href="fonts.css">
    <link rel="stylesheet" href="popup.css">
    <script src="translations/pokemon.js" defer></script>
    <script src="popup.js" type="module"></script>
  </head>
  <body>
    <header>
      <img src="icons/48.png" width="40" height="40" alt="">
      <div><span>POKÉSURVIVOR</span><h1>한국어 모드</h1></div>
      <a class="github-link" href="https://github.com/evan-choi/pokesurvivor-kor" target="_blank" rel="noopener noreferrer" aria-label="GitHub 저장소">
        <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path fill="currentColor" d="M12 .75a11.25 11.25 0 0 0-3.558 21.922c.563.104.768-.244.768-.543 0-.267-.01-.974-.015-1.912-3.13.68-3.79-1.507-3.79-1.507-.512-1.3-1.25-1.646-1.25-1.646-1.022-.699.077-.685.077-.685 1.13.08 1.724 1.16 1.724 1.16 1.005 1.722 2.637 1.224 3.279.936.102-.727.393-1.224.715-1.505-2.498-.284-5.124-1.249-5.124-5.56 0-1.228.438-2.232 1.158-3.019-.116-.285-.502-1.429.11-2.977 0 0 .944-.302 3.094 1.153A10.79 10.79 0 0 1 12 6.19c.956.004 1.919.129 2.818.379 2.149-1.455 3.091-1.153 3.091-1.153.614 1.548.228 2.692.112 2.977.721.787 1.157 1.791 1.157 3.019 0 4.322-2.63 5.273-5.136 5.552.404.348.766 1.035.766 2.086 0 1.506-.014 2.721-.014 3.09 0 .302.203.653.774.542A11.25 11.25 0 0 0 12 .75Z"/></svg>
      </a>
    </header>
    <main id="game-controls" hidden>
      <section class="collection" aria-labelledby="collection-title">
        <div class="collection-heading">
          <h2 id="collection-title">보유 포켓몬 <span id="collection-count" aria-live="polite"></span></h2>
          <button id="refresh-collection" type="button">새로고침</button>
        </div>
        <input id="pokemon-search" type="search" aria-label="보유 포켓몬 검색" aria-controls="pokemon-list" placeholder="이름 또는 도감 번호로 검색" autocomplete="off" disabled>
        <p id="collection-status" role="status">보유 목록 불러오는 중…</p>
        <ol id="pokemon-list" aria-label="보유 포켓몬 순위"></ol>
        <p class="tier-source"><a href="https://pokesurvivor.net/tier-list/" target="_blank" rel="noreferrer">PokéSurvivor Guide ↗</a> · 능력치 기준<br><span id="tier-updated"></span></p>
      </section>
    </main>
    <a class="play" href="https://pokesurvivor.com/" target="_blank" rel="noreferrer">게임 열기 <span aria-hidden="true">↗</span></a>
  </body>
</html>
